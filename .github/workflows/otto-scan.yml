# Otto Security Scan — GitHub Actions Workflow
# Add this to any repo you want Otto to scan.
#
# Required secrets:
#   OTTO_API_URL    — Your Otto backend URL (e.g. https://otto.example.com)
#   OTTO_API_TOKEN  — A valid JWT token or repo webhook secret
#
# The workflow triggers on pull requests and pushes to the default branch,
# sends the code to Otto for vulnerability scanning, and posts findings
# as a PR comment (when triggered by a pull request).

name: Otto Security Scan

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write

jobs:
  otto-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Trigger Otto scan
        id: scan
        run: |
          PR_NUMBER=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
          fi

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ secrets.OTTO_API_URL }}/scan" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.OTTO_API_TOKEN }}" \
            -d "{
              \"repoFullName\": \"${{ github.repository }}\",
              \"commitSha\": \"${{ github.sha }}\",
              \"prNumber\": ${PR_NUMBER:-null},
              \"ref\": \"${{ github.ref }}\"
            }")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "status_code=$HTTP_CODE" >> "$GITHUB_OUTPUT"
          echo "response<<EOF" >> "$GITHUB_OUTPUT"
          echo "$BODY" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::Otto scan failed with HTTP $HTTP_CODE"
            echo "$BODY"
            exit 1
          fi

          STATUS=$(echo "$BODY" | python3 -c "import sys,json; print(json.load(sys.stdin).get('status','unknown'))" 2>/dev/null || echo "unknown")
          echo "scan_status=$STATUS" >> "$GITHUB_OUTPUT"

          SERIOUS=$(echo "$BODY" | python3 -c "import sys,json; print(json.load(sys.stdin).get('counts',{}).get('serious',0))" 2>/dev/null || echo "0")
          MINOR=$(echo "$BODY" | python3 -c "import sys,json; print(json.load(sys.stdin).get('counts',{}).get('minor',0))" 2>/dev/null || echo "0")
          echo "serious=$SERIOUS" >> "$GITHUB_OUTPUT"
          echo "minor=$MINOR" >> "$GITHUB_OUTPUT"

          echo "### Otto Security Scan" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Status:** $STATUS" >> "$GITHUB_STEP_SUMMARY"
          echo "**Serious:** $SERIOUS | **Minor:** $MINOR" >> "$GITHUB_STEP_SUMMARY"

      - name: Check scan results
        if: steps.scan.outputs.scan_status == 'fail'
        run: |
          echo "::warning::Otto found security vulnerabilities: ${{ steps.scan.outputs.serious }} serious, ${{ steps.scan.outputs.minor }} minor"
          # Uncomment the next line to block PRs with serious findings:
          # if [ "${{ steps.scan.outputs.serious }}" -gt 0 ]; then exit 1; fi

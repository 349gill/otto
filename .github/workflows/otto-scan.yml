# Otto Security Scan — GitHub Actions Workflow
# Add this workflow to any repository you want Otto to automatically scan.
#
# Required secrets (Settings -> Secrets and variables -> Actions):
#   OTTO_API_URL    — Your Otto backend URL (e.g. https://guide-carve-stout.ngrok-free.dev)
#   OTTO_API_TOKEN  — Your Otto JWT token or repository webhook secret
#
# Triggers on pull requests and pushes to default branches.
# Automatically audits code changes, posts/updates PR comments with security findings
# and suggested fixes, and outputs GitHub step summaries.

name: Otto Security Scan

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  otto-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Validate configuration
        env:
          OTTO_API_URL: ${{ secrets.OTTO_API_URL }}
          OTTO_API_TOKEN: ${{ secrets.OTTO_API_TOKEN }}
        run: |
          if [ -z "$OTTO_API_URL" ] || [ -z "$OTTO_API_TOKEN" ]; then
            echo "::error::Otto configuration missing. Please add OTTO_API_URL and OTTO_API_TOKEN in repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Trigger Otto scan
        id: scan
        env:
          OTTO_API_URL: ${{ secrets.OTTO_API_URL }}
          OTTO_API_TOKEN: ${{ secrets.OTTO_API_TOKEN }}
        run: |
          PR_NUMBER=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
          fi

          CLEAN_URL=$(echo "$OTTO_API_URL" | sed 's:/*$::')

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "$CLEAN_URL/scan" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OTTO_API_TOKEN" \
            -H "ngrok-skip-browser-warning: true" \
            -d "{
              \"repoFullName\": \"${{ github.repository }}\",
              \"commitSha\": \"${{ github.sha }}\",
              \"prNumber\": ${PR_NUMBER:-null},
              \"ref\": \"${{ github.ref }}\"
            }")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "status_code=$HTTP_CODE" >> "$GITHUB_OUTPUT"

          if [ "$HTTP_CODE" -ge 400 ] || [ "$HTTP_CODE" -eq 000 ]; then
            echo "::error::Otto scan failed with HTTP $HTTP_CODE"
            echo "$BODY"
            exit 1
          fi

          echo "$BODY" > scan_response.json

          STATUS=$(python3 -c "import json; data=json.load(open('scan_response.json')); print(data.get('status','unknown'))" 2>/dev/null || echo "unknown")
          SERIOUS=$(python3 -c "import json; data=json.load(open('scan_response.json')); print(data.get('counts',{}).get('serious',0))" 2>/dev/null || echo "0")
          MINOR=$(python3 -c "import json; data=json.load(open('scan_response.json')); print(data.get('counts',{}).get('minor',0))" 2>/dev/null || echo "0")

          echo "scan_status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "serious=$SERIOUS" >> "$GITHUB_OUTPUT"
          echo "minor=$MINOR" >> "$GITHUB_OUTPUT"

          echo "### 🔒 Otto Security Scan" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Status:** $STATUS" >> "$GITHUB_STEP_SUMMARY"
          echo "**Serious:** $SERIOUS | **Minor:** $MINOR" >> "$GITHUB_STEP_SUMMARY"

      - name: Post PR comment with findings & suggested fixes
        if: github.event_name == 'pull_request' && always() && steps.scan.outputs.scan_status != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            if (!fs.existsSync('scan_response.json')) return;

            const scan = JSON.parse(fs.readFileSync('scan_response.json', 'utf8'));
            const status = scan.status || 'unknown';
            const serious = scan.counts?.serious || 0;
            const minor = scan.counts?.minor || 0;
            const findings = scan.findings || [];

            let comment = `## 🔒 Otto Security Scan\n\n`;
            comment += `**Commit:** \`${context.sha.slice(0, 7)}\`\n`;

            if (findings.length === 0) {
              comment += `**Status:** ✅ Passed - No security vulnerabilities detected.\n\n`;
            } else {
              comment += `**Status:** ${serious > 0 ? '🔴 Fail' : '⚠️ Warning'} - ${findings.length} issue(s) identified (${serious} serious, ${minor} minor)\n\n`;

              comment += `### Findings\n\n`;
              comment += `| File | Line | Finding | Severity | Rule |\n`;
              comment += `|------|------|---------|----------|------|\n`;
              for (const f of findings) {
                const title = (f.title || f.comment || '').replace(/\|/g, '\\|').slice(0, 100);
                const line = f.line > 0 ? f.line : '-';
                comment += `| \`${f.file}\` | ${line} | ${title} | **${f.severity}** | \`${f.ruleId || 'SEC'}\` |\n`;
              }
              comment += `\n`;

              const withFixes = findings.filter(f => f.fix && f.fix.trim());
              if (withFixes.length > 0) {
                comment += `<details>\n<summary>💡 <b>Suggested Fixes (${withFixes.length})</b></summary>\n\n`;
                for (const f of withFixes) {
                  comment += `#### ${f.file}${f.line > 0 ? `:${f.line}` : ''} (${f.ruleId || 'Fix'})\n`;
                  comment += `**${f.title}**\n\n`;
                  comment += `> ${f.comment}\n\n`;
                  comment += `\`\`\`suggestion\n${f.fix}\n\`\`\`\n\n`;
                }
                comment += `</details>\n\n`;
              }
            }

            comment += `---\n*Otto Security Assessment Platform*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body && c.body.includes('## 🔒 Otto Security Scan'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: comment,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment,
              });
            }

      - name: Check scan gate
        if: steps.scan.outputs.scan_status == 'fail'
        run: |
          echo "::warning::Otto identified security vulnerabilities: ${{ steps.scan.outputs.serious }} serious, ${{ steps.scan.outputs.minor }} minor"
